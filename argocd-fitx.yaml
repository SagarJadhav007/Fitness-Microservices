apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitx
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/SagarJadhav007/Fitness-Microservices.git
    targetRevision: master
    path: k8s

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: fitx

  syncPolicy:
    automated:
      prune: false
      selfHeal: true

    syncOptions:
      - CreateNamespace=true