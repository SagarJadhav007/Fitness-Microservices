spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI}

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: user-service
              uri: http://userservice:8081
              predicates:
                - Path=/api/users/**

            - id: user-workout-plans
              uri: http://userservice:8081
              predicates:
                - Path=/api/plans/**

            - id: activity-service
              uri: http://activityservice:8082
              predicates:
                - Path=/api/activities/**

            - id: ai-service
              uri: http://aiservice:8083
              predicates:
                - Path=/api/recommendations/**

            - id: ai-service-workout
              uri: http://aiservice:8083
              predicates:
                - Path=/api/ai/plans/**


server:
  port: 8089


management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true