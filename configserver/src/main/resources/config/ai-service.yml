spring:
  data:
    mongodb:
      uri: mongodb://${MONGODB_USER:admin}:${MONGODB_PASSWORD:password}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:activitydb}?authSource=admin
      database: ${MONGODB_DATABASE:activitydb}

    rabbitmq:
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
      username: guest
      password: guest

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

rabbitmq:
  exchange:
    name: fitness.exchange

  activity:
    queue: activity.queue
    routingKey: activity.tracking

  goals:
    queue: goals.queue
    routingKey: goals

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}
