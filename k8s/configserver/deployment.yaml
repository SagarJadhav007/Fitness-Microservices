apiVersion: apps/v1
kind: Deployment
metadata:
  name: configserver
  namespace: fitx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configserver
  template:
    metadata:
      labels:
        app: configserver
    spec:
      containers:
        - name: configserver
          image: 020641930163.dkr.ecr.ap-south-1.amazonaws.com/fitx/configserver:v2
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: configserver
  namespace: fitx
spec:
  type: ClusterIP
  selector:
    app: configserver
  ports:
    - port: 8888
      targetPort: 8888
