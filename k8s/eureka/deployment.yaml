apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: fitx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: 020641930163.dkr.ecr.ap-south-1.amazonaws.com/fitx/eureka:v1
          ports:
            - containerPort: 8761
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: fitx
spec:
  type: ClusterIP
  selector:
    app: eureka
  ports:
    - port: 8761
      targetPort: 8761
