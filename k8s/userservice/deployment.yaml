apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: fitx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: userservice

  template:
    metadata:
      labels:
        app: userservice

    spec:
      containers:
        - name: userservice
          image: 020641930163.dkr.ecr.ap-south-1.amazonaws.com/fitx/userservice:v4

          ports:
            - containerPort: 8081

          envFrom:
            - secretRef:
                name: fitx-backend-secrets

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            - name: CONFIG_SERVER_URL
              value: "http://configserver:8888"

            - name: EUREKA_CLIENT_ENABLED
              value: "false"

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: fitx

spec:
  type: ClusterIP

  selector:
    app: userservice

  ports:
    - port: 8081
      targetPort: 8081